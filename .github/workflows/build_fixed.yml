name: Build 7249 Shorts APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jdm7249/vault
          cat > 'settings.gradle' <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JDM7249Shorts"
          include ':app'
          EOF_SETTINGS
          cat > 'build.gradle' <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF_ROOT
          cat > 'gradle.properties' <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS
          cat > 'app/build.gradle' <<'EOF_APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.jdm7249.vault'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.jdm7249.vault"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF_APP
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          
              <application
                  android:allowBackup="true"
                  android:label="7249 Shorts"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST
          cat > 'app/src/main/java/com/jdm7249/vault/MainActivity.kt' <<'EOF_KT'
          package com.jdm7249.vault
          
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.DocumentsContract
          import android.text.Editable
          import android.text.TextUtils
          import android.text.TextWatcher
          import android.util.LruCache
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import androidx.viewpager2.widget.ViewPager2
          import kotlinx.coroutines.*
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.*
          
          data class ShortVideo(
              val uri: Uri,
              val name: String,
              val lastModified: Long,
              var isLiked: Boolean = false
          )
          
          class MainActivity : AppCompatActivity() {
          
              private val PREFS = "jdm_7249_prefs"
              private val KEY_FOLDER_URI = "saved_nomedia_folder_uri"
              private val KEY_LIKED_SET = "liked_videos_set"
              private val KEY_SKIP_INTRO = "skip_intro_mode"
              private val REQ_OPEN_TREE = 7249
          
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private val allVideos = mutableListOf<ShortVideo>()
              private val displayedVideos = mutableListOf<ShortVideo>()
          
              private var currentSort = "date_desc" // date_desc, date_asc, liked, name_asc
              private var searchQuery = ""
              private var skipIntroMode = false
          
              private lateinit var rootFrame: FrameLayout
              private lateinit var gridContainer: LinearLayout
              private lateinit var countBadge: TextView
              private lateinit var gridRecycler: RecyclerView
              private lateinit var gridAdapter: ShortsGridAdapter
              private lateinit var emptySetupBox: LinearLayout
          
              // Fullscreen Shorts Player Overlay
              private lateinit var playerOverlay: FrameLayout
              private lateinit var viewPager: ViewPager2
              private lateinit var pagerAdapter: ShortsPagerAdapter
              private var exoPlayer: ExoPlayer? = null
              private var activePlayerView: PlayerView? = null
              private lateinit var bottomScrubber: SeekBar
              private lateinit var timeReadout: TextView
              private lateinit var playerTitleText: TextView
              private lateinit var playerDateText: TextView
              private lateinit var likeBtnText: TextView
              private lateinit var skipIntroBtn: TextView
          
              private val progressHandler = Handler(Looper.getMainLooper())
              private var isUserScrubbing = false
          
              private val memCache = object : LruCache<String, Bitmap>(16 * 1024) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount / 1024
              }
          
              private fun thumbnailSized(bitmap: Bitmap): Bitmap {
                  val maxWidth = 360
                  if (bitmap.width <= maxWidth) return bitmap
                  val height = (bitmap.height.toLong() * maxWidth / bitmap.width).toInt().coerceAtLeast(1)
                  return Bitmap.createScaledBitmap(bitmap, maxWidth, height, true).also {
                      if (it !== bitmap) bitmap.recycle()
                  }
              }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0A0A0A")
                  window.navigationBarColor = Color.parseColor("#0A0A0A")
          
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  skipIntroMode = prefs.getBoolean(KEY_SKIP_INTRO, false)
          
                  buildModernUI()
          
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (playerOverlay.visibility == View.VISIBLE) {
                              closeShortsPlayer()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
          
                  val savedUriStr = prefs.getString(KEY_FOLDER_URI, null)
                  if (savedUriStr != null) {
                      val uri = Uri.parse(savedUriStr)
                      loadFolderVideosFast(uri)
                  } else {
                      emptySetupBox.visibility = View.VISIBLE
                  }
              }
          
              private fun dp(v: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
          
              private fun pillBg(colorHex: String, radiusDp: Int = 20): GradientDrawable =
                  GradientDrawable().apply {
                      setColor(Color.parseColor(colorHex))
                      cornerRadius = dp(radiusDp).toFloat()
                  }
          
              private fun buildModernUI() {
                  rootFrame = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#0A0A0A"))
                  }
          
                  gridContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }
          
                  // Top App Bar
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(8))
                  }
          
                  val logoBadge = TextView(this).apply {
                      text = "▶"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER
                      background = pillBg("#FF0033", 8)
                      layoutParams = LinearLayout.LayoutParams(dp(28), dp(28)).apply { rightMargin = dp(8) }
                  }
          
                  val titleView = TextView(this).apply {
                      text = "7249 Shorts"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setTypeface(typeface, Typeface.BOLD)
                  }
          
                  countBadge = TextView(this).apply {
                      text = "0"
                      setTextColor(Color.parseColor("#D4D4D8"))
                      textSize = 12f
                      setPadding(dp(8), dp(2), dp(8), dp(2))
                      background = pillBg("#27272A", 12)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { leftMargin = dp(8) }
                  }
          
                  val spacer = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, 1, 1f)
                  }
          
                  val changeFolderBtn = TextView(this).apply {
                      text = "Folder"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(dp(12), dp(6), dp(12), dp(6))
                      background = pillBg("#27272A", 16)
                      setOnClickListener { promptSelectNomediaFolder() }
                  }
          
                  topBar.addView(logoBadge)
                  topBar.addView(titleView)
                  topBar.addView(countBadge)
                  topBar.addView(spacer)
                  topBar.addView(changeFolderBtn)
                  gridContainer.addView(topBar)
          
                  // Search Input
                  val searchInput = EditText(this).apply {
                      hint = "Search filename..."
                      setHintTextColor(Color.parseColor("#71717A"))
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setSingleLine(true)
                      setPadding(dp(14), dp(8), dp(14), dp(8))
                      background = pillBg("#18181B", 18)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(dp(14), dp(2), dp(14), dp(8))
                      }
                      addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                          override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                              searchQuery = s?.toString()?.trim() ?: ""
                              applySortAndFilter()
                          }
                          override fun afterTextChanged(s: Editable?) {}
                      })
                  }
                  gridContainer.addView(searchInput)
          
                  // Sort Chips Row (Newest Saved, Oldest Saved, Liked, A-Z)
                  val sortRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(14), 0, dp(14), dp(10))
                  }
          
                  val sortOptions = listOf(
                      "date_desc" to "Newest Saved",
                      "date_asc" to "Oldest Saved",
                      "liked" to "Liked ♥",
                      "name_asc" to "A–Z"
                  )
                  val sortButtons = mutableMapOf<String, TextView>()
          
                  fun refreshSortPills() {
                      for ((key, btn) in sortButtons) {
                          if (key == currentSort) {
                              btn.setTextColor(Color.BLACK)
                              btn.background = pillBg("#FFFFFF", 16)
                          } else {
                              btn.setTextColor(Color.parseColor("#D4D4D8"))
                              btn.background = pillBg("#1F1F23", 16)
                          }
                      }
                  }
          
                  for ((key, label) in sortOptions) {
                      val chip = TextView(this).apply {
                          text = label
                          textSize = 12f
                          setTypeface(typeface, Typeface.BOLD)
                          setPadding(dp(12), dp(6), dp(12), dp(6))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { rightMargin = dp(6) }
                          setOnClickListener {
                              currentSort = key
                              refreshSortPills()
                              applySortAndFilter()
                          }
                      }
                      sortButtons[key] = chip
                      sortRow.addView(chip)
                  }
                  refreshSortPills()
                  gridContainer.addView(sortRow)
          
                  // One-Time Setup Box (Only shown before folder is linked)
                  emptySetupBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      setPadding(dp(24), dp(48), dp(24), dp(48))
                  }
                  val setupTitle = TextView(this).apply {
                      text = "Link Your .nomedia Folder Once"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  val setupSub = TextView(this).apply {
                      text = "Pick your hidden folder once. All 560 Shorts will load automatically every time you open the app, sorted by Date Saved with 0.5s cosplayer covers."
                      setTextColor(Color.parseColor("#A1A1AA"))
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(18))
                  }
                  val setupBtn = TextView(this).apply {
                      text = "Select .nomedia Folder"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(dp(22), dp(12), dp(22), dp(12))
                      background = pillBg("#FF0033", 24)
                      setOnClickListener { promptSelectNomediaFolder() }
                  }
                  emptySetupBox.addView(setupTitle)
                  emptySetupBox.addView(setupSub)
                  emptySetupBox.addView(setupBtn)
                  gridContainer.addView(emptySetupBox)
          
                  // 3-Column 9:16 YouTube Shorts Grid
                  gridRecycler = RecyclerView(this).apply {
                      layoutManager = GridLayoutManager(this@MainActivity, 3)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
