                      )
                  }
                  gridAdapter = ShortsGridAdapter()
                  gridRecycler.adapter = gridAdapter
                  gridContainer.addView(gridRecycler)
          
                  rootFrame.addView(gridContainer)
          
                  // Fullscreen Vertical Swipe Shorts Player Overlay
                  buildPlayerOverlay()
                  rootFrame.addView(playerOverlay)
          
                  setContentView(rootFrame)
              }
          
              private fun buildPlayerOverlay() {
                  playerOverlay = FrameLayout(this).apply {
                      visibility = View.GONE
                      setBackgroundColor(Color.BLACK)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }
          
                  viewPager = ViewPager2(this).apply {
                      orientation = ViewPager2.ORIENTATION_VERTICAL
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }
                  pagerAdapter = ShortsPagerAdapter()
                  viewPager.adapter = pagerAdapter
                  viewPager.registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                      override fun onPageSelected(position: Int) {
                          super.onPageSelected(position)
                          playShortAt(position)
                      }
                  })
                  playerOverlay.addView(viewPager)
          
                  // Top Bar Inside Player (Back + Skip Intro Toggle)
                  val topPlayerBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(16), dp(12), dp(12))
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                      )
                  }
          
                  val backBtn = TextView(this).apply {
                      text = "←"
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      gravity = Gravity.CENTER
                      background = pillBg("#80000000", 20)
                      layoutParams = LinearLayout.LayoutParams(dp(40), dp(40))
                      setOnClickListener { closeShortsPlayer() }
                  }
          
                  val topSpace = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, 1, 1f)
                  }
          
                  skipIntroBtn = TextView(this).apply {
                      text = if (skipIntroMode) "Car Drop Only: ON" else "Car Drop Only: OFF"
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(dp(12), dp(6), dp(12), dp(6))
                      background = pillBg(if (skipIntroMode) "#CCFF0033" else "#80000000", 16)
                      setOnClickListener {
                          skipIntroMode = !skipIntroMode
                          getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                              .edit()
                              .putBoolean(KEY_SKIP_INTRO, skipIntroMode)
                              .apply()
                          skipIntroBtn.text = if (skipIntroMode) "Car Drop Only: ON" else "Car Drop Only: OFF"
                          skipIntroBtn.background = pillBg(if (skipIntroMode) "#CCFF0033" else "#80000000", 16)
                      }
                  }
          
                  topPlayerBar.addView(backBtn)
                  topPlayerBar.addView(topSpace)
                  topPlayerBar.addView(skipIntroBtn)
                  playerOverlay.addView(topPlayerBar)
          
                  // Right Side Vertical Action Rail (Like + Set Current Frame as Cover)
                  val rightRail = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.END
                      ).apply {
                          rightMargin = dp(12)
                          bottomMargin = dp(90)
                      }
                  }
          
                  likeBtnText = TextView(this).apply {
                      text = "🤍"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      background = pillBg("#80000000", 24)
                      layoutParams = LinearLayout.LayoutParams(dp(48), dp(48)).apply { bottomMargin = dp(16) }
                      setOnClickListener { toggleLikeCurrentVideo() }
                  }
          
                  val setCoverBtn = TextView(this).apply {
                      text = "📸"
                      textSize = 20f
                      gravity = Gravity.CENTER
                      background = pillBg("#80000000", 24)
                      layoutParams = LinearLayout.LayoutParams(dp(48), dp(48))
                      setOnClickListener { lockCurrentFrameAsCover() }
                  }
                  val setCoverLabel = TextView(this).apply {
                      text = "Cover"
                      setTextColor(Color.WHITE)
                      textSize = 10f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(2), 0, 0)
                  }
          
                  rightRail.addView(likeBtnText)
                  rightRail.addView(setCoverBtn)
                  rightRail.addView(setCoverLabel)
                  playerOverlay.addView(rightRail)
          
                  // Bottom Controls (Title + Saved Date + Red YouTube Scrubber Slider)
                  val bottomBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(16), dp(14), dp(10))
                      setBackgroundColor(Color.parseColor("#99000000"))
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                      )
                  }
          
                  playerDateText = TextView(this).apply {
                      text = ""
                      setTextColor(Color.parseColor("#A1A1AA"))
                      textSize = 11f
                  }
          
                  playerTitleText = TextView(this).apply {
                      text = ""
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setTypeface(typeface, Typeface.BOLD)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(0, dp(2), dp(60), dp(6))
                  }
          
                  val sliderRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
          
                  bottomScrubber = SeekBar(this).apply {
                      max = 1000
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              if (fromUser) {
                                  val player = exoPlayer ?: return
                                  val dur = player.duration.coerceAtLeast(1L)
                                  val targetMs = (dur * progress) / 1000L
                                  player.seekTo(targetMs)
                                  timeReadout.text = "${formatMs(targetMs)} / ${formatMs(dur)}"
                              }
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) { isUserScrubbing = true }
                          override fun onStopTrackingTouch(seekBar: SeekBar?) { isUserScrubbing = false }
                      })
                  }
          
                  timeReadout = TextView(this).apply {
                      text = "0:00 / 0:00"
                      setTextColor(Color.parseColor("#E4E4E7"))
                      textSize = 11f
                      setPadding(dp(6), 0, 0, 0)
                  }
          
                  sliderRow.addView(bottomScrubber)
                  sliderRow.addView(timeReadout)
          
                  bottomBox.addView(playerDateText)
                  bottomBox.addView(playerTitleText)
                  bottomBox.addView(sliderRow)
                  playerOverlay.addView(bottomBox)
              }
          
              private fun promptSelectNomediaFolder() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                          Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION or
                          Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                      )
                  }
                  startActivityForResult(intent, REQ_OPEN_TREE)
              }
          
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OPEN_TREE && resultCode == Activity.RESULT_OK) {
                      val treeUri = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(
                              treeUri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {}
                      getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit()
                          .putString(KEY_FOLDER_URI, treeUri.toString())
                          .apply()
                      loadFolderVideosFast(treeUri)
                  }
              }
          
              // Fast ContentResolver query that reads 560+ video entries & saved dates in <100ms
              private fun loadFolderVideosFast(treeUri: Uri) {
                  emptySetupBox.visibility = View.GONE
                  scope.launch {
                      val likedSet = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getStringSet(KEY_LIKED_SET, emptySet()) ?: emptySet()
          
                      val loaded = withContext(Dispatchers.IO) {
                          val list = mutableListOf<ShortVideo>()
                          val docId = DocumentsContract.getTreeDocumentId(treeUri)
                          val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, docId)
                          val projection = arrayOf(
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                              DocumentsContract.Document.COLUMN_MIME_TYPE,
                              DocumentsContract.Document.COLUMN_LAST_MODIFIED
                          )
                          contentResolver.query(childrenUri, projection, null, null, null)?.use { cursor ->
                              val idCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_DOCUMENT_ID)
                              val nameCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_DISPLAY_NAME)
                              val mimeCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_MIME_TYPE)
                              val dateCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_LAST_MODIFIED)
          
                              while (cursor.moveToNext()) {
                                  val childId = cursor.getString(idCol) ?: continue
                                  val name = cursor.getString(nameCol) ?: continue
                                  val mime = cursor.getString(mimeCol) ?: ""
                                  val lastMod = if (cursor.isNull(dateCol)) 0L else cursor.getLong(dateCol)
          
                                  val isVideo = mime.startsWith("video/") ||
                                      name.endsWith(".mp4", true) ||
                                      name.endsWith(".webm", true) ||
                                      name.endsWith(".mkv", true) ||
                                      name.endsWith(".mov", true)
          
                                  if (isVideo && !name.startsWith(".")) {
                                      val fileUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, childId)
                                      list.add(ShortVideo(fileUri, name, lastMod, likedSet.contains(name)))
                                  }
                              }
                          }
                          list
                      }
          
                      allVideos.clear()
                      allVideos.addAll(loaded)
                      applySortAndFilter()
                      if (allVideos.isEmpty()) {
                          emptySetupBox.visibility = View.VISIBLE
                      }
                  }
              }
          
              private fun applySortAndFilter() {
                  val filtered = allVideos.filter { v ->
                      if (currentSort == "liked" && !v.isLiked) return@filter false
                      if (searchQuery.isNotEmpty() && !v.name.contains(searchQuery, ignoreCase = true)) return@filter false
                      true
                  }.toMutableList()
          
                  when (currentSort) {
                      "date_asc" -> filtered.sortBy { it.lastModified }
                      "name_asc" -> filtered.sortBy { it.name.lowercase(Locale.getDefault()) }
                      else -> filtered.sortByDescending { it.lastModified } // Default: Newest Saved first
                  }
          
                  displayedVideos.clear()
                  displayedVideos.addAll(filtered)
                  countBadge.text = "${displayedVideos.size}"
                  gridAdapter.notifyDataSetChanged()
                  pagerAdapter.notifyDataSetChanged()
              }
          
              // Extracts & caches the 0.5s (500,000 microsecond) cosplayer frame
              private fun loadOrExtractThumbnail(video: ShortVideo, targetView: ImageView) {
                  val key = video.name
                  targetView.tag = key
                  memCache.get(key)?.let {
                      targetView.setImageBitmap(it)
                      return
                  }
          
                  targetView.setImageDrawable(null)
                  scope.launch {
                      val bmp = withContext(Dispatchers.IO) {
                          val cacheFile = File(cacheDir, "cover_05s_${key.hashCode()}.jpg")
                          if (cacheFile.exists()) {
                              BitmapFactory.decodeFile(cacheFile.absolutePath)
                          } else {
                              val retriever = MediaMetadataRetriever()
                              try {
                                  retriever.setDataSource(this@MainActivity, video.uri)
                                  // Grab frame at 0.5s (500,000 microseconds) where cosplayer intro is
                                  val raw = retriever.getFrameAtTime(500_000L, MediaMetadataRetriever.OPTION_CLOSEST)
                                      ?: retriever.frameAtTime
                                  val thumbnail = raw?.let { thumbnailSized(it) }
                                  if (thumbnail != null) {
                                      FileOutputStream(cacheFile).use { out ->
                                          thumbnail.compress(Bitmap.CompressFormat.JPEG, 80, out)
                                      }
                                  }
                                  thumbnail
                              } catch (_: Exception) {
                                  null
                              } finally {
                                  try { retriever.release() } catch (_: Exception) {}
                              }
                          }
                      }
                      if (bmp != null) {
                          memCache.put(key, bmp)
                          if (targetView.tag == key) {
                              targetView.setImageBitmap(bmp)
                          }
                      }
                  }
              }
          
              private fun lockCurrentFrameAsCover() {
                  val pos = viewPager.currentItem
                  val video = displayedVideos.getOrNull(pos) ?: return
                  val player = exoPlayer ?: return
                  val currentUs = player.currentPosition.coerceAtLeast(0L) * 1000L
          
                  scope.launch {
                      val bmp = withContext(Dispatchers.IO) {
                          val retriever = MediaMetadataRetriever()
                          try {
                              retriever.setDataSource(this@MainActivity, video.uri)
                              val frame = retriever.getFrameAtTime(currentUs, MediaMetadataRetriever.OPTION_CLOSEST)
                                  ?.let { thumbnailSized(it) }
                              if (frame != null) {
                                  val cacheFile = File(cacheDir, "cover_05s_${video.name.hashCode()}.jpg")
                                  FileOutputStream(cacheFile).use { out ->
                                      frame.compress(Bitmap.CompressFormat.JPEG, 85, out)
                                  }
                              }
                              frame
                          } catch (_: Exception) {
                              null
                          } finally {
                              try { retriever.release() } catch (_: Exception) {}
                          }
                      }
                      if (bmp != null) {
                          memCache.put(video.name, bmp)
                          gridAdapter.notifyItemChanged(pos)
                          Toast.makeText(this@MainActivity, "Locked current frame as thumbnail!", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          
              private fun toggleLikeCurrentVideo() {
                  val pos = viewPager.currentItem
                  val video = displayedVideos.getOrNull(pos) ?: return
                  video.isLiked = !video.isLiked
                  likeBtnText.text = if (video.isLiked) "❤️" else "🤍"
          
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val set = (prefs.getStringSet(KEY_LIKED_SET, emptySet()) ?: emptySet()).toMutableSet()
                  if (video.isLiked) set.add(video.name) else set.remove(video.name)
                  prefs.edit().putStringSet(KEY_LIKED_SET, set).apply()
                  gridAdapter.notifyItemChanged(pos)
              }
          
              private fun openShortsPlayer(startIndex: Int) {
                  if (displayedVideos.isEmpty()) return
                  playerOverlay.visibility = View.VISIBLE
                  if (exoPlayer == null) {
                      exoPlayer = ExoPlayer.Builder(this).build().apply {
                          repeatMode = Player.REPEAT_MODE_ONE
                      }
                  }
                  viewPager.setCurrentItem(startIndex, false)
                  viewPager.post { playShortAt(startIndex) }
                  startProgressTicker()
              }
          
              private fun closeShortsPlayer() {
                  progressHandler.removeCallbacksAndMessages(null)
                  exoPlayer?.pause()
                  activePlayerView?.player = null
                  playerOverlay.visibility = View.GONE
              }
          
              private fun playShortAt(position: Int) {
                  val video = displayedVideos.getOrNull(position) ?: return
                  val player = exoPlayer ?: return
          
                  playerTitleText.text = video.name.substringBeforeLast(".")
                  val df = SimpleDateFormat("MMM d, yyyy", Locale.getDefault())
                  playerDateText.text = "Saved ${df.format(Date(video.lastModified))}"
                  likeBtnText.text = if (video.isLiked) "❤️" else "🤍"
          
                  val rv = viewPager.getChildAt(0) as? RecyclerView
                  val holder = rv?.findViewHolderForAdapterPosition(position) as? ShortsPagerAdapter.PageHolder
                  if (holder != null) {
                      activePlayerView?.player = null
                      activePlayerView = holder.playerView
                      holder.playerView.player = player
                  }
          
                  player.setMediaItem(MediaItem.fromUri(video.uri))
                  player.prepare()
                  if (skipIntroMode) {
                      player.seekTo(1800L) // Jump straight to JDM car beat drop
                  } else {
                      player.seekTo(0L)
                  }
                  player.playWhenReady = true
              }
          
              private fun startProgressTicker() {
                  progressHandler.removeCallbacksAndMessages(null)
                  progressHandler.post(object : Runnable {
                      override fun run() {
                          val player = exoPlayer
                          if (player != null && !isUserScrubbing && playerOverlay.visibility == View.VISIBLE) {
                              val dur = player.duration.coerceAtLeast(1L)
                              val cur = player.currentPosition.coerceAtLeast(0L)
                              if (skipIntroMode && cur < 1650L && dur > 2500L) {
                                  player.seekTo(1800L)
                              }
                              bottomScrubber.progress = ((cur * 1000L) / dur).toInt().coerceIn(0, 1000)
                              timeReadout.text = "${formatMs(cur)} / ${formatMs(dur)}"
                          }
                          progressHandler.postDelayed(this, 100L)
                      }
                  })
              }
          
              private fun formatMs(ms: Long): String {
                  val totalSec = (ms / 1000L).coerceAtLeast(0L)
                  val m = totalSec / 60L
                  val s = totalSec % 60L
                  return String.format(Locale.US, "%d:%02d", m, s)
              }
          
              override fun onDestroy() {
                  super.onDestroy()
                  progressHandler.removeCallbacksAndMessages(null)
                  exoPlayer?.release()
                  scope.cancel()
              }
          
              // 3-Column 9:16 Grid Adapter
              inner class ShortsGridAdapter : RecyclerView.Adapter<ShortsGridAdapter.GridHolder>() {
                  inner class GridHolder(
                      val container: FrameLayout,
                      val image: ImageView,
                      val dateLabel: TextView
                  ) : RecyclerView.ViewHolder(container)
          
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): GridHolder {
                      val screenW = resources.displayMetrics.widthPixels
                      val cellW = screenW / 3
                      val cellH = (cellW * 16) / 9
          
                      val frame = FrameLayout(parent.context).apply {
                          layoutParams = ViewGroup.MarginLayoutParams(cellW, cellH).apply {
                              setMargins(dp(1), dp(1), dp(1), dp(1))
                          }
                          setBackgroundColor(Color.parseColor("#18181B"))
                      }
                      val img = ImageView(parent.context).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          layoutParams = FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          )
                      }
                      val dateTxt = TextView(parent.context).apply {
                          setTextColor(Color.WHITE)
                          textSize = 10f
                          setPadding(dp(6), dp(2), dp(6), dp(4))
                          setBackgroundColor(Color.parseColor("#66000000"))
                          layoutParams = FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              Gravity.BOTTOM
                          )
                      }
                      frame.addView(img)
                      frame.addView(dateTxt)
                      return GridHolder(frame, img, dateTxt)
                  }
          
                  override fun onBindViewHolder(holder: GridHolder, position: Int) {
                      val item = displayedVideos[position]
                      val df = SimpleDateFormat("MMM d", Locale.getDefault())
                      holder.dateLabel.text = df.format(Date(item.lastModified)) + (if (item.isLiked) " ❤️" else "")
                      loadOrExtractThumbnail(item, holder.image)
                      holder.container.setOnClickListener { openShortsPlayer(position) }
                  }
          
                  override fun getItemCount(): Int = displayedVideos.size
              }
          
              // Vertical Swipe Pager Adapter
              inner class ShortsPagerAdapter : RecyclerView.Adapter<ShortsPagerAdapter.PageHolder>() {
                  inner class PageHolder(val frame: FrameLayout, val playerView: PlayerView) :
                      RecyclerView.ViewHolder(frame)
          
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): PageHolder {
                      val frame = FrameLayout(parent.context).apply {
                          layoutParams = ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          )
                          setBackgroundColor(Color.BLACK)
                      }
                      val pv = PlayerView(parent.context).apply {
                          useController = false
                          resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                          layoutParams = FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          )
                      }
                      frame.addView(pv)
                      frame.setOnClickListener {
                          val p = exoPlayer ?: return@setOnClickListener
                          if (p.isPlaying) p.pause() else p.play()
                      }
                      return PageHolder(frame, pv)
                  }
          
                  override fun onBindViewHolder(holder: PageHolder, position: Int) {
                      if (position == viewPager.currentItem && exoPlayer != null) {
                          activePlayerView?.player = null
                          activePlayerView = holder.playerView
                          holder.playerView.player = exoPlayer
                      }
                  }
          
                  override fun getItemCount(): Int = displayedVideos.size
              }
          }
